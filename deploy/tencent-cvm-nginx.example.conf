# Optional reverse-proxy example after a domain is available.
# Direct IP + port deployment does not need this file.

server {
    listen 80;
    server_name travel.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name travel.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/travel.yourdomain.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/travel.yourdomain.com.key;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
