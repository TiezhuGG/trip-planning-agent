services:
  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${BACKEND_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${BACKEND_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${BACKEND_PIP_TRUSTED_HOST:-}
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PUBLIC_PORT:-8080}:80"
